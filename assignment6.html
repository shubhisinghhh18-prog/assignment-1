 Q6-Build a basic HTML page with a title and a few headings .
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Page</title>
</head>
<body>
    <h1>This is Heading 1 - Main Title</h1>
    <h2>This is Heading 2 - Sub Title</h2>
    <h3>This is Heading 3 - Section Heading</h3>
    <h4>This is Heading 4</h4>
    <h5>This is Heading 5</h5>
    <h6>This is Heading 6</h6>

    <p>This is a basic HTML page with a title and different headings.</p>
</body>
</html>
